name: Fumi
options:
  bundleIdPrefix: dev.fumi
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
targets:
  Fumi:
    type: application
    platform: iOS
    sources:
      - path: Fumi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fumi.mail
        INFOPLIST_KEY_CFBundleDisplayName: Fumi
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Fumi/Fumi.entitlements
    dependencies:
      - target: FumiWidget
        embed: true
  FumiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FumiWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fumi.mail.widget
        INFOPLIST_KEY_CFBundleDisplayName: Fumi Codes
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: FumiWidget/FumiWidget.entitlements
